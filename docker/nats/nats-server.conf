# Local development NATS server configuration with JetStream enabled.
# Persistent file storage so streams/consumers survive container restarts.

server_name: tm-local-nats
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 1GB
  max_file_store: 10GB
}

# Local dev only: no auth configured. Do not reuse this file for any
# shared or internet-reachable environment.
