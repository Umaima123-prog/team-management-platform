# Railway production NATS server configuration - JetStream enabled,
# persistent file storage under the mounted volume at /data.
#
# Deliberately a SEPARATE file from nats-server.conf (local dev) even
# though the content is nearly identical: that file's own comment
# warns it is local-dev-only and should not be reused verbatim for a
# shared/internet-reachable environment. This service is private-
# networking-only (no public domain/TCP proxy - see
# docs/ARCHITECTURE.md), so no additional auth is configured here
# either, but keeping the files separate avoids ever having to
# reconsider that local-dev warning under time pressure later.
#
# Baked into a custom image (see ./Dockerfile) because Railway's
# "custom start command" does not override a Docker-image-sourced
# service's own ENTRYPOINT/CMD - confirmed live (the container kept
# running the base image's default `--config /etc/nats/nats-server.conf`
# regardless of any start-command override). Building a tiny image
# that replaces that same config path is the straightforward fix.

server_name: tm-railway-nats
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 1GB
  max_file_store: 10GB
}
